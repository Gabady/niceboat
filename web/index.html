<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071b2a">
  <meta name="description" content="選手を育て、五つの水面を駆ける。スマホで遊ぶ育成と一人称の操作型ボートレース『競艇物語』。">
  <title>競艇物語 V127</title>
  <style>
/* 競艇物語 — Deep water, race-white numerals, signal amber. */
:root {
  color-scheme:dark;
  --bg:#071b2a;
  --surface:#0e293a;
  --surface-2:#123448;
  --edge:#254453;
  --text:#eff5f5;
  --muted:#a5bac5;
  --teal:#80e0d0;
  --amber:#f4c276;
  --danger:#ffadac;
  --radius:15px;
  --shadow:0 16px 45px #020e1b33;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  font-size:16px;
  line-height:1.65
}
* {
  box-sizing:border-box
}
html {
  scroll-behavior:smooth;
  scroll-padding:20px
}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  min-width:280px
}
button,input,select,textarea {
  font:inherit
}
button {
  cursor:pointer;
  -webkit-tap-highlight-color:transparent
}
button:disabled {
  cursor:default;
  opacity:.4
}
button,input,select,textarea {
  touch-action:manipulation
}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible {
  outline:3px solid var(--teal);
  outline-offset:4px
}
button {
  color:inherit
}
button:hover:not(:disabled) {
  filter:brightness(1.1)
}
input,select,textarea {
  width:100%;
  background:#081f2e;
  border:1px solid #416272;
  border-radius:9px;
  color:var(--text);
  padding:12px 14px;
  min-height:48px
}
input[type=checkbox] {
  width:24px;
  height:24px;
  min-height:24px;
  accent-color:var(--teal);
  flex:none
}
textarea {
  resize:vertical;
  line-height:1.6;
  word-break:break-all
}
label {
  font-size:.875rem
}
h1,h2,h3,p {
  margin-top:0
}
h1 {
  font-size:clamp(1.8rem,4.5vw,2.5rem);
  line-height:1.35;
  letter-spacing:.025em;
  margin-bottom:10px
}
h2 {
  font-size:1.02rem;
  line-height:1.5;
  margin-bottom:18px
}
h3 {
  font-size:1rem;
  margin-bottom:8px
}
p {
  margin-bottom:14px
}
small {
  font-size:.8rem
}
strong,b {
  font-weight:700
}
em,i {
  font-style:normal
}
a {
  color:var(--teal)
}
.muted {
  color:var(--muted)
}
.small {
  font-size:.875rem
}
.micro {
  font-size:.78rem
}
.positive {
  color:var(--teal)
}
.amber {
  color:var(--amber)
}
.danger-text {
  color:var(--danger)!important
}
.eyebrow {
  font-size:.75rem;
  letter-spacing:.15em;
  font-weight:700;
  color:var(--teal);
  text-transform:uppercase
}
.loading {
  padding:60px
}
.masthead {
  max-width:1100px;
  margin:auto;
  height:85px;
  padding:15px 34px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--edge)
}
.brand {
  background:none;
  border:0;
  padding:0;
  text-align:left;
  font-size:1.2rem;
  font-weight:900;
  letter-spacing:.13em;
  line-height:1.4
}
.brand span {
  display:block;
  font-size:.62rem;
  letter-spacing:.16em;
  color:var(--muted);
  margin-top:4px
}
.version {
  font-size:.75rem;
  color:var(--muted);
  font-variant-numeric:tabular-nums
}
#app {
  max-width:1100px;
  margin:auto;
  padding:32px 34px 45px;
  outline:0
}
.page-heading {
  margin-bottom:26px
}
.page-heading .eyebrow {
  display:block;
  margin-bottom:10px
}
.page-heading p {
  margin-bottom:0
}
.panel {
  background:var(--surface);
  border:1px solid var(--edge);
  border-radius:var(--radius);
  padding:24px;
  margin-bottom:20px;
  box-shadow:var(--shadow);
  min-width:0
}
.two-column {
  display:grid;
  grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);
  gap:24px;
  align-items:start
}
.two-column>div,.race-layout>div {
  min-width:0
}
.section-line {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:16px
}
.section-line h2 {
  margin:0
}
.btn {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:48px;
  padding:12px 18px;
  border:1px solid var(--edge);
  border-radius:9px;
  background:var(--surface-2);
  font-size:.9rem;
  line-height:1.5;
  font-weight:600;
  text-align:center;
  transition:background .15s,transform .15s;
  word-break:normal
}
.btn:active:not(:disabled) {
  transform:translateY(1px)
}
.primary {
  background:var(--amber);
  color:#16232b;
  border-color:var(--amber);
  box-shadow:0 4px 16px #f5c27712
}
.secondary {
  background:#16394a;
  border-color:#365768
}
.large {
  width:100%;
  margin-top:16px;
  min-height:56px
}
.text-btn {
  background:transparent;
  border:0;
  box-shadow:none;
  padding:9px 8px;
  min-height:44px;
  color:var(--muted);
  font-weight:500
}
.active {
  background:var(--teal);
  color:var(--bg)
}
.button-row {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:12px 0
}
.button-row>.btn {
  flex:1;
  min-width:100px
}
.chip-row,.skill-chips {
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  align-items:center
}
.chip {
  display:inline-flex;
  align-items:center;
  font-size:.75rem;
  line-height:1.4;
  padding:5px 9px;
  border:1px solid #365564;
  background:#153547;
  border-radius:5px;
  color:#c9dbe2;
  white-space:normal
}
.chip.teal {
  color:var(--teal);
  border-color:#407369;
  background:#173e41
}
.chip.gold {
  color:var(--amber);
  border-color:#775b34;
  background:#42382b
}
.chip.live {
  color:var(--teal);
  letter-spacing:.13em;
  background:none;
  border:0;
  padding:0
}
.skill-chip {
  padding:8px 10px;
  border-radius:6px;
  background:#173547;
  border:1px solid #466374;
  min-height:40px;
  font-size:.83rem;
  text-align:left;
  line-height:1.45
}
.skill-chip b {
  font-size:.7rem;
  margin-right:4px;
  letter-spacing:.05em
}
.skill-chip.n,.rarity-text.n {
  color:#d5e0e5
}
.skill-chip.r,.rarity-text.r {
  color:#8fe1cc;
  border-color:#3c7169
}
.skill-chip.sr,.rarity-text.sr {
  color:#89c9ff;
  border-color:#3d6c92
}
.skill-chip.ssr,.rarity-text.ssr {
  color:#ccb0ff;
  border-color:#756197
}
.skill-chip.ur,.rarity-text.ur {
  color:#f3cf8a;
  border-color:#a88c55
}
.skill-chip.lr,.rarity-text.lr {
  color:#ffdae7;
  border-color:#bd7e93;
  background:#432d43
}
.skill-chip.weak {
  color:#ffb4b4;
  border-color:#805056;
  background:#362939
}
.field-label {
  display:block;
  margin:14px 0 8px
}
.field-label:first-child {
  margin-top:0
}
.stats-grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:21px 18px
}
.stat {
  min-width:0
}
.stat>span {
  display:block;
  font-size:.83rem;
  color:#b7cbd4;
  white-space:nowrap
}
.stat>strong {
  display:flex;
  align-items:center;
  gap:7px;
  font-size:1.8rem;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.035em;
  line-height:1.7
}
.grade {
  font-size:.8rem;
  color:#b2c5d0;
  line-height:1.3;
  min-width:18px;
  letter-spacing:0
}
.grade-S {
  color:#ffd599
}
.grade-A {
  color:#b8a8ff
}
.grade-B {
  color:#83d7db
}
.stat-track {
  height:4px;
  border-radius:4px;
  background:#2c4654;
  overflow:hidden
}
.stat-track>span {
  display:block;
  height:100%;
  background:var(--teal);
  border-radius:4px
}
.growth-arrow {
  color:var(--teal);
  font-size:.8rem;
  letter-spacing:-.07em
}
.growth-label {
  display:flex;
  gap:9px;
  align-items:center;
  margin:24px 0 10px;
  font-size:.8rem;
  color:var(--muted)
}
.adjust-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px
}
.adjust-grid>div>* {
  display:block
}
.adjust-grid b {
  font-size:.8rem;
  margin:6px 0
}
.adjust-grid small {
  color:var(--muted)
}
.equipment-grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
  margin:12px 0
}
.equipment-grid>div {
  padding:13px 10px;
  border-left:2px solid #386a74;
  background:#092433;
  border-radius:0 7px 7px 0;
  min-width:0
}
.equipment-grid .eyebrow {
  font-size:.63rem;
  letter-spacing:.07em
}
.equipment-grid b {
  display:block;
  font-size:.86rem;
  margin:4px 0 8px
}
.equipment-grid p {
  font-size:.77rem;
  color:#b3cbd3;
  margin:0;
  line-height:1.85
}
.synergy {
  margin-top:20px;
  border-top:1px solid var(--edge);
  padding-top:16px;
  font-size:.83rem
}
.synergy>div {
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap
}
.synergy p {
  margin:8px 0 0;
  color:#b5ccd5;
  display:flex;
  align-items:baseline;
  gap:12px
}
.synergy p>span {
  font-size:.72rem;
  color:var(--muted);
  flex:none
}
.wallet {
  margin:4px 0 22px
}
.wallet>div+div {
  margin-top:15px
}
.wallet span {
  display:block;
  color:var(--muted);
  font-size:.8rem
}
.wallet strong {
  font-size:2.05rem;
  font-variant-numeric:tabular-nums;
  line-height:1.5;
  overflow-wrap:anywhere
}
.wallet strong small {
  font-size:.9rem;
  margin-left:6px
}
.wallet b {
  font-size:1.06rem
}
.gate {
  padding-top:15px;
  border-top:1px solid var(--edge);
  margin-top:15px
}
.gate>div:first-child {
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  gap:8px;
  margin-bottom:12px;
  font-size:.83rem
}
.gate span small {
  color:var(--muted)
}
.gate p {
  font-size:.78rem;
  margin:10px 0 0;
  color:var(--muted)
}
.career-strip {
  display:flex;
  gap:5px;
  margin:0 0 24px
}
.career-strip>span {
  flex:1;
  min-width:0;
  padding:7px 0;
  border-top:3px solid #2c4858;
  text-align:center;
  color:#8aa3b2;
  font-size:.7rem;
  font-weight:700
}
.career-strip .current {
  border-color:var(--amber);
  color:var(--amber);
  background:#f4c2760c
}
.career-strip .complete {
  border-color:var(--teal);
  color:var(--teal)
}
.save-footer {
  margin-top:34px;
  padding-top:18px;
  border-top:1px solid var(--edge);
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:space-between;
  font-size:.75rem;
  color:var(--muted)
}
.bottom-nav {
  display:flex;
  justify-content:center;
  gap:24px;
  margin-top:25px
}
.bottom-nav .text-btn {
  font-size:.8rem
}
.steps {
  padding-left:24px;
  margin:0
}
.steps li {
  padding:0 0 22px 4px;
  color:var(--teal)
}
.steps li:last-child {
  padding-bottom:8px
}
.steps b,.steps span {
  display:block
}
.steps b {
  color:var(--text);
  font-size:.94rem
}
.steps span {
  color:var(--muted);
  font-size:.84rem;
  margin-top:5px
}
details {
  border-top:1px solid var(--edge);
  margin-top:20px;
  padding:14px 0 0
}
summary {
  font-size:.85rem;
  color:#c6d7e0;
  cursor:pointer;
  min-height:36px
}
details[open]>summary {
  margin-bottom:14px
}
.debug {
  background:#071724;
  padding:14px;
  border:1px solid var(--edge);
  border-radius:10px;
  margin-top:22px
}
.debug pre {
  font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;
  max-height:320px;
  overflow:auto;
  white-space:pre-wrap;
  word-break:break-word;
  color:#a8c9d2
}
.debug-status {
  font-size:.8rem
}
.debug-status p {
  margin-top:10px
}
.debug-status .btn {
  font-size:.8rem
}
.table-wrap {
  max-width:100%;
  overflow-x:auto
}
table {
  border-collapse:collapse;
  width:100%;
  font-size:.83rem;
  text-align:left
}
th {
  font-size:.72rem;
  font-weight:500;
  color:var(--muted);
  padding:7px 8px 12px;
  border-bottom:1px solid #496070;
  line-height:1.5
}
td {
  padding:12px 8px;
  border-bottom:1px solid #284758
}
td:first-child,th:first-child {
  padding-left:4px
}
td:last-child,th:last-child {
  text-align:right;
  padding-right:4px
}
td small {
  display:block;
  color:var(--muted);
  font-size:.73rem;
  margin-top:4px
}
.own-row {
  background:#173c44
}
.standing-number {
  display:inline-flex;
  width:28px;
  height:28px;
  align-items:center;
  justify-content:center;
  font-weight:800
}
.standing-number.qualifying {
  color:var(--teal)
}
.standing-number.semi {
  color:var(--amber)
}
.you {
  display:inline-block;
  font-size:.6rem;
  background:var(--teal);
  color:#092535;
  border-radius:3px;
  padding:1px 4px;
  font-weight:800;
  vertical-align:middle
}
.boat-token {
  display:inline-flex;
  justify-content:center;
  align-items:center;
  min-width:29px;
  width:29px;
  height:30px;
  border-radius:5px;
  font-size:.95rem;
  font-weight:900;
  line-height:1;
  border:1px solid #ffffff45
}
.boat-1 {
  background:#f0f3f3;
  color:#14283c
}
.boat-2 {
  background:#182431;
  color:#f0f3f4;
  border-color:#8796a5
}
.boat-3 {
  background:#ed6373;
  color:#1a1523
}
.boat-4 {
  background:#63b4f3;
  color:#092b49
}
.boat-5 {
  background:#f6cd66;
  color:#3b310a
}
.boat-6 {
  background:#5bd3a4;
  color:#063229
}
.name-button {
  border:0;
  background:none;
  font-size:.9rem;
  text-align:left;
  padding:5px 0;
  color:#edf7f9;
  line-height:1.5;
  font-weight:700;
  min-height:40px;
  max-width:100%;
  overflow-wrap:anywhere
}
.runners-table td:nth-child(1) {
  width:38px
}
.runners-table td:nth-child(3) {
  width:79px;
  white-space:nowrap;
  font-size:.77rem
}
.runners-table td>strong {
  font-size:1.24rem;
  display:block;
  font-variant-numeric:tabular-nums
}
.runners-table td>strong>small {
  display:inline;
  font-size:.65rem;
  margin-left:2px
}
.tiny-skills {
  font-size:.68rem;
  line-height:1.75
}
.training-grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:9px
}
.training-btn {
  flex-direction:column;
  gap:4px;
  padding:14px 4px;
  border-color:#36606a;
  background:#103b43
}
.training-btn span {
  font-size:.8rem
}
.training-btn b {
  font-size:1.4rem;
  font-variant-numeric:tabular-nums
}
.balance-note {
  font-size:.8rem;
  margin:16px 0 0;
  color:var(--amber)
}
.action-log {
  min-height:68px;
  max-height:230px;
  overflow:auto;
  font-size:.86rem
}
.action-log p {
  margin:0 0 9px;
  padding-left:10px;
  border-left:2px solid var(--teal)
}
.action-log p:last-child {
  margin-bottom:0
}
.weather-bar {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
  margin:-4px 0 20px
}
.weather-bar strong {
  font-size:.87rem;
  margin-right:auto
}
.pre-brief {
  border-left:2px solid var(--amber);
  padding-left:13px
}
.pre-brief p {
  font-size:.9rem;
  margin:12px 0 0
}
.strategy-grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:7px
}
.strategy {
  background:#102d3b;
  border:1px solid #36566a;
  border-radius:8px;
  padding:13px 5px;
  text-align:center
}
.strategy b,.strategy small {
  display:block
}
.strategy b {
  font-size:.83rem
}
.strategy small {
  font-size:.67rem;
  color:var(--muted);
  margin-top:6px
}
.strategy.selected {
  background:#25494a;
  border-color:var(--teal);
  color:var(--teal)
}
.race-layout {
  display:grid;
  grid-template-columns:minmax(0,1.26fr) minmax(0,1fr);
  gap:22px;
  align-items:start
}
.race-track {
  position:relative;
  width:100%;
  aspect-ratio:600/380;
  background:#0e303d;
  overflow:hidden;
  border:1px solid #426271;
  border-radius:15px;
  isolation:isolate
}
.course-svg {
  display:block;
  width:100%;
  height:100%;
  position:absolute;
  inset:0
}
.course-svg text {
  font-size:14px;
  font-family:inherit;
  letter-spacing:1px;
  font-weight:600;
  fill:#b0d1d3
}
.track-center {
  position:absolute;
  top:28%;
  left:21%;
  width:58%;
  z-index:2
}
.track-phase {
  color:var(--amber);
  font-size:clamp(.75rem,1.5vw,1.08rem);
  font-weight:800;
  letter-spacing:.14em;
  text-align:center;
  margin-bottom:9px;
  line-height:1.3
}
.center-standings {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:6px 10px
}
.center-standings>div {
  display:flex;
  gap:4px;
  align-items:center;
  min-width:0;
  font-size:12px;
  line-height:1.4
}
.center-standings>div>span:last-child {
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  min-width:0
}
.center-standings .own {
  color:var(--teal)
}
.mini-rank {
  font-size:11px;
  color:var(--muted);
  min-width:8px
}
.mini-boat {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:17px;
  height:17px;
  flex:none;
  font-size:11px;
  font-weight:800;
  border-radius:3px;
  border-width:1px;
  border-style:solid;
  border-color:#ffffff22
}
.boat-layer {
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:3
}
.moving-boat {
  position:absolute;
  transform:translate(-50%,-50%);
  width:25px;
  height:25px;
  border:1px solid #ffffff9c;
  border-radius:6px;
  font-size:14px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 3px 8px #030f204d;
  line-height:1;
  will-change:left,top
}
.moving-boat:nth-child(2) {
  margin-top:5px
}
.moving-boat:nth-child(3) {
  margin-top:-6px
