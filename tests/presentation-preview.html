<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>v97 演出確認</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../story.css"><style>body{padding:24px;max-width:600px;margin:auto}button{margin:6px;min-height:48px;padding:12px 18px}p{line-height:1.8}select{margin:8px;padding:12px}</style></head><body><h1>v97 演出確認</h1><p>本番と同じ描画処理です。クリックして各演出を確認できます。ゲームのセーブや報酬には影響しません。</p><label>演出<select id="mode"><option value="full">標準</option><option value="short">短縮</option><option value="off">なし</option></select></label><div id="buttons"></div><script src="../data.js"></script><script src="../presentation.js"></script><script>const samples=[{title:'優勝',kicker:'最高峰シリーズ',note:'積み重ねた走りが、頂点に届いた。',reward:'優勝賞金を獲得',kind:'win',rarity:'SSR'},{title:'妨害返し',kicker:'UR / 新しい力',note:'新たな戦術が、走りを変える。',reward:'特殊能力を獲得',kind:'rare',rarity:'UR'},{title:'鏡面水域',kicker:'LR / 最高峰の証',note:'選手の物語に、新たな一頁。',reward:'特殊能力を獲得',kind:'rare',rarity:'LR'},{title:'勝負の一手',kicker:'強イベント',note:'挑戦は、次の水面へ。',reward:'整備の成果',kind:'surge',rarity:'UR',tone:'surge'},{title:'雨のピット',note:'機材を整えて次走へ。',kind:'setback',tone:'setback',rarity:'SR'}];KM_PRESENTATION.scene('raceResult');samples.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.title;b.onclick=()=>KM_PRESENTATION.show(s,{presentation:document.querySelector('#mode').value,haptics:false});document.querySelector('#buttons').appendChild(b);});</script></body></html>
